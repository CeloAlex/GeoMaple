# O npm 10.8.2 (versão do builder Nixpacks) tem um bug conhecido de
# optional dependencies com o binário nativo do rolldown (bundler do Vite 8)
# para linux-x64-gnu (npm/cli#4828). npm@10.9.2 corrige a detecção de
# plataforma. NÃO usar --libc=glibc explícito: o pacote
# @rolldown/binding-linux-x64-gnu não declara campo "libc" no registry, e essa
# flag faz o npm excluí-lo em vez de resolvê-lo.
[phases.install]
cmds = [
  "npm install -g npm@10.9.2",
  "rm -f package-lock.json",
  "npm cache clean --force",
  "npm install",
]
