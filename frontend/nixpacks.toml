# O builder do Nixpacks/Railway pode rodar em arquitetura/plataforma diferente
# da imagem final, fazendo o npm resolver o binário nativo opcional errado para
# o rolldown (bundler do Vite 8) — ele tenta linux-x64-gnu, wasi e wasm32-wasi,
# e nenhum é instalado. Forçar --os/--cpu/--libc explicitamente resolve.
[phases.install]
cmds = ["rm -f package-lock.json", "npm install --os=linux --cpu=x64 --libc=glibc"]
